on: [pull_request]
name: Tests

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        symfony: ['6.4.*', '7.4.*', '8.0.*']
        exclude:
          # Symfony 6.4 requires PHP 8.1+
          - php: '8.0'
            symfony: '6.4.*'
          # Symfony 7 requires PHP 8.2+
          - php: '8.0'
            symfony: '7.4.*'
          - php: '8.1'
            symfony: '7.4.*'
          # Symfony 8 requires PHP 8.4+
          - php: '8.0'
            symfony: '8.0.*'
          - php: '8.1'
            symfony: '8.0.*'
          - php: '8.2'
            symfony: '8.0.*'
          - php: '8.3'
            symfony: '8.0.*'

    env:
      SYMFONY_REQUIRE: ${{ matrix.symfony }}

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: composer global config --no-plugins allow-plugins.symfony/flex true
      - run: composer global require --no-progress symfony/flex
      - run: composer update --no-progress
      - run: vendor/bin/phpunit
